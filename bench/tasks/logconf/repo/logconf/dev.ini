; Logging for the shop service.
;
; Loggers:
;   root  everything not configured below, to the console
;   db    connections and queries
;   http  one line per request

[loggers]
keys=root,db,http

[handlers]
keys=console,debugfile

[formatters]
keys=detailed,short

[logger_root]
level=DEBUG
handlers=console

[logger_db]
level=DEBUG
handlers=console,debugfile
propagate=0
qualname=db

[logger_http]
level=INFO
handlers=console
propagate=0
qualname=http

[handler_console]
class=StreamHandler
level=DEBUG
formatter=short
args=(sys.stderr,)

[handler_debugfile]
class=FileHandler
level=DEBUG
formatter=detailed
args=('%(logdir)s/debug.log', 'a', 'utf-8')

[formatter_detailed]
format=%(asctime)s %(levelname)-8s %(name)s [%(filename)s:%(lineno)d] %(message)s

[formatter_short]
format=%(levelname)s %(name)s: %(message)s
