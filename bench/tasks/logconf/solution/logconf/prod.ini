[loggers]
keys=root,db

[handlers]
keys=file,dbfile

[formatters]
keys=line

[logger_root]
level=INFO
handlers=file

[logger_db]
level=WARNING
handlers=dbfile
qualname=db

[handler_file]
class=FileHandler
formatter=line
args=('%(logdir)s/app.log', 'a', 'utf-8')

[handler_dbfile]
class=FileHandler
formatter=line
args=('%(logdir)s/db.log', 'a', 'utf-8')

[formatter_line]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
