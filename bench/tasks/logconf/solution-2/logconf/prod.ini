[loggers]
keys=root,db

[handlers]
keys=file,db_file

[formatters]
keys=line

[logger_root]
level=INFO
handlers=file

; The db logger: warnings and above, to db.log only.
[logger_db]
level=WARN
handlers=db_file
propagate=0
qualname=db

[handler_file]
class=FileHandler
formatter=line
args=('%(logdir)s/app.log', 'a', 'utf-8')

[handler_db_file]
class=FileHandler
formatter=line
args=('%(logdir)s/db.log',)
kwargs={'encoding': 'utf-8'}

[formatter_line]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
