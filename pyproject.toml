[project]
name = "agent-cowork-memory"
version = "0.2.0"
description = "Shared task memory and delegation for Codex, Cursor, Claude Code, and OpenCode."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2"]

[project.scripts]
acm = "agent_cowork_memory.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cowork_memory"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
