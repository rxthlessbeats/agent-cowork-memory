repos:
  - repo: local
    hooks:
      - id: check
        name: ruff and tests
        entry: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE bash -c 'uv run --with ruff ruff check src tests --select F && uv run python -m unittest discover -s tests -q'
        language: system
        pass_filenames: false
        always_run: true
